name: re-id-evaluation

# Runs the same evaluate.py used to produce the numbers in the README and
# on the resume, on every push and PR. Fails the build if the tuned
# matcher's precision or recall regresses below the thresholds achieved
# in this project (see README.md "Measured accuracy" section for how
# those numbers were obtained). This is the smallest honest version of
# an "automated evaluation pipeline": no training involved, just a
# regression gate on the matching logic's own measured behavior.

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch: {}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install demo-mode dependencies
        run: pip install -r backend/requirements.txt

      - name: Run re-ID evaluation harness (regression gate)
        run: |
          cd backend
          python evaluate.py --ticks 400 --seed 1 --runs 10 \
            --min-precision 0.90 --min-recall 0.95
